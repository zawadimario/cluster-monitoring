apiVersion: v1
kind: ConfigMap
metadata:
  name: alpine-ping-dockerfile
data:
  Dockerfile: |
    FROM alpine:latest
    RUN apk update && apk add --no-cache iputils
    CMD ["ping", "-c", "10", "8.8.8.8"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-case-dind
spec:
  hostNetwork: true
  containers:
  - name: pod-case-dind
    image: docker:29.0.4-dind-alpine3.22
    securityContext:
      privileged: true
    env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    lifecycle:
      postStart:
        exec:
          command:
            - "/bin/sh"
            - "-c"
            - |
              apk update && apk upgrade
              apk add bash
    volumeMounts:
    - name: dind-storage
      mountPath: /var/lib/docker
    - name: dockerfile-volume
      mountPath: /tmp
    resources: {}
  volumes:
  - name: dind-storage
    emptyDir: {}
  - name: dockerfile-volume
    configMap:
      name: alpine-ping-dockerfile
---
kind: Service
apiVersion: v1
metadata:
  name: nfs-server
  namespace: kube-system
  labels:
    app: nfs-server
spec:
  type: ClusterIP
  selector:
    app: nfs-server
  ports:
    - name: tcp-2049
      port: 2049
      protocol: TCP
    - name: udp-111
      port: 111
      protocol: UDP
    - name: mountd
      port: 20048
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: nfs-server
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nfs-server
  template:
    metadata:
      name: nfs-server
      labels:
        app: nfs-server
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: nfs-server
          image: erichough/nfs-server:latest
          env:
            - name: SHARED_DIRECTORY
              value: "/exports"
            - name: NFS_EXPORT_0
              value: "/exports *(rw,fsid=0,sync,no_subtree_check,no_root_squash)"
          volumeMounts:
            - mountPath: /exports
              name: nfs-vol
          securityContext:
            privileged: true
          ports:
            - name: tcp-2049
              containerPort: 2049
              protocol: TCP
            - name: udp-111
              containerPort: 111
              protocol: UDP
            - name: mountd
              containerPort: 20048
      volumes:
        - name: nfs-vol
          emptyDir: {}
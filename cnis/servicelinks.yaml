apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  connection-string: "postgresql://db_user:secure_password@db-host:5432/prod_db"
---
apiVersion: v1
kind: Pod
metadata:
  name: payment-api-pod
  labels:
    app: payment-api
spec:
  # enableServiceLinks: false
  containers:
  - name: api-server
    image: node:20-alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    ports:
    - containerPort: 3000
    env:
    - name: NODE_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: connection-string
---
apiVersion: v1
kind: Pod
metadata:
  name: payment-api-pod-servicelinks
spec:
  containers:
  - name: api-server
    image: node:20-alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    ports:
    - containerPort: 3000
    env:
    - name: NODE_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: connection-string
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: payment-api
  name: payment-api-svc
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: payment-api
  sessionAffinity: None
  type: ClusterIP
apiVersion: v1
kind: Pod
metadata:
  name: docker-in-docker
spec:
  hostNetwork: true
  containers:
  - name: pod-case-dind
    image: docker:29.0.4-dind-alpine3.22
    securityContext:
      privileged: true
    env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    lifecycle:
      postStart:
        exec:
          command:
            - "/bin/sh"
            - "-c"
            - |
              apk update && apk upgrade
              apk add bash
    volumeMounts:
    - name: dind-storage
      mountPath: /var/lib/docker
    command: ["dockerd-entrypoint.sh"]
    resources: {}
  volumes:
  - name: dind-storage
    emptyDir: {}
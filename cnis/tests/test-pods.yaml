apiVersion: v1
kind: Pod
metadata:
  name: centos-docker
  labels:
    server: linux
spec:
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: server
            operator: In
            values:
            - linux
        topologyKey: "kubernetes.io/hostname"
  containers:
  - name: pod-case-0
    image: docker.io/centos/tools:latest
    command:
    - /sbin/init
---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: dex
  name: dex
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
      serviceAccountName: dex
      containers:
      - image: dexidp/dex
        imagePullPolicy: Always
        name: dex
        command: ["/usr/local/bin/dex", "serve", "/etc/dex/cfg/config.yaml"]
        ports:
        - name: https
          containerPort: 5556
        volumeMounts:
        - name: config
          mountPath: /etc/dex/cfg
        env:
        - name: OIDC_CLIENT_ID
          value: "headlamp-oidc-authservice"
        - name: OIDC_CLIENT_SECRET
          value: "aGVhZGxhbXAtc2VjcmV0"
        - name: HOME
          value: "/"
        - name: KUBERNETES_POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources: {}
      volumes:
      - name: config
        configMap:
          name: dex
          items:
          - key: config.yaml
            path: config.yaml
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: dex
  namespace: auth
data:
  APPLICATION_SECRET: aGVhZGxhbXAtc2VjcmV0
  CLIENT_ID: headlamp-oidc-authservice
  ISSUER: http://dex.auth.svc.cluster.local:5556/dex
  LDAP_BIND_DN: cn=adminuser,dc=techtel,dc=com
  LDAP_BIND_PWD: admin123
  LDAP_GROUP_BASE_DN: dc=techtel,dc=com
  LDAP_HOST: '"openldap.auth:389"'
  LDAP_USER_BASE_DN: dc=techtel,dc=com
  OIDC_REDIRECT_URIS: '["http://127.0.0.1:8000/oidc-callback"]'
  config.yaml: |
    issuer: http://dex.auth.svc.cluster.local:5556/dex
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
      telemetry:
        http: 0.0.0.0:5558
    logger:
      level: "debug"
      format: text
    connectors:
      - type: ldap
        id: ldap
        name: OpenLDAP
        config:
          host: openldap.auth:389
          insecureNoSSL: true
          insecureSkipVerify: true
          startTLS: false
          bindDN: cn=adminuser,dc=techtel,dc=com
          bindPW: admin123
          usernamePrompt: "Email Address"
          userSearch:
            baseDN: dc=techtel,dc=com
            username: sn
            idAttr: uid
            emailAttr: mail
            nameAttr: sn
          groupSearch:
            baseDN: dc=techtel,dc=com
            userMatchers:
            - userAttr: DN
              groupAttr: member
            nameAttr: sn
    oauth2:
      skipApprovalScreen: true
      alwaysShowLoginScreen: false
    staticClients:
    - id: headlamp-oidc-authservice
      redirectURIs:
      - 'http://127.0.0.1:8000/oidc-callback'
      name: 'Headlamp Login Application'
      secret: aGVhZGxhbXAtc2VjcmV0
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: auth
spec:
  type: NodePort
  ports:
  - name: dex
    port: 5556
    protocol: TCP
    targetPort: 5556
    # nodePort: 32000
  selector:
    app: dex
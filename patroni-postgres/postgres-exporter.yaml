apiVersion: apps/v1
kind: Deployment
metadata:
  name: patroni-postgres-exporter
  namespace: tectelio
  labels:
    app: patroni-postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patroni-postgres-exporter
  template:
    metadata:
      labels:
        app: patroni-postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_SOURCE_URI
          value: "patronitectel.tectelio.svc.cluster.local:5432/postgres?sslmode=disable"
        - name: DATA_SOURCE_USER
          value: "postgres"
        - name: DATA_SOURCE_PASS
          value: "zalando"
        ports:
        - containerPort: 9187
          name: metrics
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: patroni-postgres-exporter
  namespace: tectelio
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  selector:
    app: patroni-postgres-exporter
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187

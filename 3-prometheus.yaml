apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      keep_dropped_targets: 100
      sample_limit: 500000
    scrape_configs:
      - job_name: 'prometheus'
        scrape_interval: 10s
        static_configs:
        - targets: ['prometheus.observability:9090']
          labels:
            tier: 'prometheus'

      - job_name: 'redis-server'
        scrape_interval: 30s
        metrics_path: /metrics
        scheme: http
        tls_config:
          insecure_skip_verify: true
        static_configs:
        - targets: ["svc-redis-server.redis:9121"]

      - job_name: 'mysql-server'
        metrics_path: /probe
        params:
        static_configs:
        - targets:
          - mysql.default:3306
        relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: mysql.default:9104

      - job_name: 'cadvisor'
        static_configs:
        - targets: ['cadvisor.observability.svc:8080']
          labels:
            name: 'cadvisor'

      - job_name: 'minio-cluser'
        scrape_interval: 30s
        metrics_path: /minio/v2/metrics/cluster
        scheme: http
        static_configs:
        - targets: ['minio-service.default:9000']
          labels:
            app: minio

      - job_name: 'minio-resource'
        scrape_interval: 30s
        metrics_path: /minio/v2/metrics/resource
        scheme: http
        static_configs:
        - targets: ['minio-service.default:9000']
          labels:
            app: minio

      - job_name: 'minio-node'
        scrape_interval: 30s
        metrics_path: /minio/v2/metrics/node
        scheme: http
        static_configs:
        - targets: ['minio-service.default:9000']
          labels:
            app: minio

      - job_name: 'minio-bucket'
        scrape_interval: 30s
        metrics_path: /minio/v2/metrics/bucket
        scheme: http
        static_configs:
        - targets: ['minio-service.default:9000']
          labels:
            app: minio

      - job_name: 'kubernetes-nodes'
        scrape_interval: 15s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: "kubernetes-cadvisor"
        scrape_interval: 15s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: "kubernetes-services"
        scrape_interval: 30s
        scheme: http
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_service_name]
          target_label: service
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          target_label: prometheus_io_scrape
          action: replace
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: .*
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          regex: kube-system|kube-public|kube-node-lease
          action: drop
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
          regex: default;kubernetes
          action: drop
     
      - job_name: 'kube-proxy'
        scrape_interval: 30s
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - source_labels: [__meta_kubernetes_node_name]
          target_label: __address__
          regex: (.+)
          replacement: ${1}:10249
        - target_label: __metrics_path__
          replacement: /metrics
              
      - job_name: 'kube-dns'
        scrape_interval: 30s
        kubernetes_sd_configs:
        - role: endpoints
          namespaces:
            names: ['kube-system']
        relabel_configs:
        - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          regex: kube-dns;metrics
          action: keep

      - job_name: "kubernetes-apiservers"
        scrape_interval: 30s
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      - job_name: "application-pods"
        scrape_interval: 30s
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: pod
        - source_labels: [__meta_kubernetes_namespace]
          regex: kube-system|kube-public|kube-node-lease
          action: drop

      - job_name: "kubernetes-service-endpoints"
        scrape_interval: 30s
        scheme: http
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: endpoints
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: namespace
        - source_labels: [__meta_kubernetes_service_name]
          action: replace
          target_label: service
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          target_label: prometheus_io_scrape
          action: replace
        - source_labels: [__meta_kubernetes_endpoint_port_name]
          regex: .*
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          regex: kube-system|kube-public|kube-node-lease
          action: drop
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
          regex: default;kubernetes
          action: drop

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          - alertmanager.observability:9093
    rule_files:
    - "alert-rules.yml"
  alert-rules.yml: |
    groups:
    - name: WeekendAlerts
      rules:
        - alert: WeekendAlert
          expr: |
            (day_of_week() < 6) and (up == 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Service down on a weekday"
            description: "The 'up' metric is 0, meaning a target is down, but only triggers on weekdays (Mon-Fri)."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      tier: prometheus
  template:
    metadata:
      labels:
        tier: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=2d
        - --storage.tsdb.no-lockfile
        - --web.enable-lifecycle
        - --web.route-prefix=/
        ports:
        - containerPort: 9090
        resources:
          limits:
            memory: 2000Mi
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus
        - name: prometheus-storage
          mountPath: /prometheus
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-server-conf
          defaultMode: 420
      - name: prometheus-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  selector:
    tier: prometheus
  ports:
  - port: 9090
    protocol: TCP
    targetPort: 9090
    nodePort: 30090

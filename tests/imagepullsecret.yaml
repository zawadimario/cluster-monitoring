---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-test
  labels:
    app: ping-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-test
  template:
    metadata:
      labels:
        app: ping-test
    spec:
      containers:
      - name: ping-test
        # image: zawadimario/sample-api:v1.0.1
        image: zawadimario/ping-test:v1
        command: ["sh"]
        args: ["-c", "while true; do ping -c10 8.8.8.8; sleep 10; done"]
        imagePullPolicy: Always
      imagePullSecrets:
      - name: regcred
      
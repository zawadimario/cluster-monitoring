kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nfs-longhorn
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Mi
---
kind: Pod
apiVersion: v1
metadata:
  name: read-pod
spec:
  containers:
  - name: read-pod
    image: busybox
    command:
      - "/bin/sh"
    args:
      - "-c"
      - "while true; do echo \"Current Time: $(date)\" >> /mnt/timestamps.txt; sleep 30; done"
    volumeMounts:
      - name: nfs-pvc
        mountPath: "/mnt"
  restartPolicy: "Never"
  volumes:
    - name: nfs-pvc
      persistentVolumeClaim:
        claimName: nfs-longhorn
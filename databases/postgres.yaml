apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-postgres-data
  namespace: postgres
  labels:
    tier: postgres-dabatase
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: secret-postgres-db
  namespace: postgres
type: Opaque
data:
  .username: dGVjdGVsVXNlcg==
  .password: dGVjdGVsVXNlcg==
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres
  labels:
    tier: postgres-dabatase
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      tier: postgres-dabatase
  template:
    metadata:
      labels:
        tier: postgres-dabatase
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "tectel"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: secret-postgres-db
              key: .username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-postgres-db
              key: .password
        - name: TZ
          value: "Asia/Tokyo"
        resources: {}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: pgdata
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pvc-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: svc-postgres-db
  namespace: postgres
spec:
  type: ClusterIP
  selector:
    tier: postgres-dabatase
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: postgres
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: postgres-exporter
        image: quay.io/prometheuscommunity/postgres-exporter
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_SOURCE_URI
          value: "svc-postgres-db.postgres.svc.cluster.local:5432/tectel?sslmode=disable"
        - name: DATA_SOURCE_USER
          valueFrom:
            secretKeyRef:
              name: secret-postgres-db
              key: .username
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: secret-postgres-db
              key: .password
        ports:
        - containerPort: 9187
          name: metrics
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: postgres
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
